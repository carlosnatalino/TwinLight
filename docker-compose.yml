# TwinLight — one-shot digital twin + observability stack.
#
# Boots four services on a shared network:
#   * twin       — the digital twin (FastAPI :8080 + gRPC :50051).
#   * ui         — the React web UI (nginx), pointed at the twin via TWIN_URL.
#   * prometheus — scrapes twin:8080/metrics every 15s.
#   * grafana    — pre-provisioned with the Prometheus data source and
#                  the dashboard from examples/grafana-dashboard.json.
#
# Usage:
#   docker compose up --build
# then open:
#   http://localhost:5173             — web UI
#   http://localhost:8080/health      — twin health
#   http://localhost:8080/metrics     — raw Prometheus exposition
#   http://localhost:9090             — Prometheus UI
#   http://localhost:3000             — Grafana (admin / admin)
#
# Override the twin config (default: CORONET CONUS):
#   docker compose run --rm twin twinlight \
#       --config /app/examples/twin_config.yaml --rest-host 0.0.0.0

services:

  twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: twinlight:latest
    # gnpy's oopt-gnpy-libyang has no manylinux aarch64 wheel; the
    # image is built for linux/amd64 and runs under Rosetta/qemu on
    # Apple Silicon hosts. Declared here too so compose doesn't warn
    # about the mismatch on every up.
    platform: linux/amd64
    container_name: twinlight
    ports:
      - "8080:8080"   # REST (TAPI + /config + /metrics + /admin)
      - "50051:50051" # gNMI gRPC
    volumes:
      # /admin/snapshot writes land here on the host so they survive
      # container rebuilds. Created on first up if it doesn't exist.
      # Also read on startup by --restore-latest (see command:).
      - ./snapshots:/app/snapshots
    # Restore the most recent snapshot on startup when the mounted snapshots/
    # dir has one; otherwise start clean. The guard matters because
    # --restore-latest hard-errors (and, with restart: unless-stopped below,
    # crash-loops) when no snapshot exists yet.
    command:
      - sh
      - -c
      - >-
        if ls /app/snapshots/*.json >/dev/null 2>&1; then
        exec twinlight --config /app/examples/coronet_conus_config.yaml --rest-host 0.0.0.0 --restore-latest;
        else
        exec twinlight --config /app/examples/coronet_conus_config.yaml --rest-host 0.0.0.0;
        fi
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ui:
    build:
      context: ./twinlight-ui
      dockerfile: Dockerfile
    image: twinlight-ui:latest
    container_name: twinlight-ui
    environment:
      # URL the *browser* uses to reach the twin's REST API. The UI runs in
      # the visitor's browser, not on this docker network, so this must be a
      # host-reachable address — the twin's published port, NOT the "twin"
      # compose service name. Override for a remotely-hosted twin.
      # localhost:5173 is already in the twin's cors_origins, so CORS works
      # out of the box with the default config.
      TWIN_URL: "http://localhost:8080"
    ports:
      - "5173:80"   # served by nginx; matches the twin's allowed CORS origin
    depends_on:
      - twin
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: twinlight-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 7-day local retention is plenty for the experimental workloads
      # this stack targets; bump if you keep the stack up for longer
      # campaigns.
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      twin:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: twinlight-grafana
    environment:
      # Override on the command line for any real deployment.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Hide the welcome wizard so the user lands directly on the
      # provisioned dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON is served via the file provider; mount the
      # example dashboard read-only.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # One-shot: star the provisioned dashboard so it shows up under
  # "Starred" / the favourites list for the admin user.
  #
  # Grafana's file provisioning cannot express a star — stars are per-user
  # state in Grafana's own database, not part of a dashboard definition — so
  # the only way to set one is the HTTP API after the server is up. The call
  # is idempotent (starring twice returns 200), which matters because this
  # runs on every `docker compose up` while grafana-data persists the star.
  grafana-init:
    image: curlimages/curl:8.11.1
    container_name: twinlight-grafana-init
    depends_on:
      - grafana
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      # Must match the "uid" field in docker/grafana/dashboards/*.json.
      DASHBOARD_UID: twinlight-overview
    entrypoint:
      - sh
      - -c
      - >-
        echo "waiting for grafana...";
        until curl -sf "$$GRAFANA_URL/api/health" >/dev/null 2>&1; do sleep 2; done;
        echo "waiting for dashboard provisioning...";
        until curl -sf -u "$$GRAFANA_USER:$$GRAFANA_PASSWORD"
        "$$GRAFANA_URL/api/dashboards/uid/$$DASHBOARD_UID" >/dev/null 2>&1;
        do sleep 2; done;
        curl -sf -X POST -u "$$GRAFANA_USER:$$GRAFANA_PASSWORD"
        "$$GRAFANA_URL/api/user/stars/dashboard/uid/$$DASHBOARD_UID" >/dev/null
        && echo "starred dashboard $$DASHBOARD_UID"
        || echo "could not star dashboard $$DASHBOARD_UID (non-fatal)"
    # A one-shot task: it must not be restarted after it exits.
    restart: "no"


volumes:
  prometheus-data:
  grafana-data:
