# TwinLight — one-shot digital twin + observability stack.
#
# Boots five services on a shared network:
#   * gnpy-api   — GNPy, run as a service for the twin. Built from the
#                  oopt-gnpy-api git branch that carries the session API.
#   * twin       — the digital twin (FastAPI :8080 + gRPC :50051).
#   * ui         — the React web UI (nginx), pointed at the twin via TWIN_URL.
#   * prometheus — scrapes twin:8080/metrics every 15s.
#   * grafana    — pre-provisioned with the Prometheus data source and
#                  the dashboard from examples/grafana-dashboard.json.
#
# Each service sets `hostname` to its service name. Compose adds the service
# name as a DNS alias only when it creates a container. Recreating the project
# network — the ONOS overlay pins a subnet on this same default network, so
# switching between the two files does that — reconnects existing containers
# without those aliases, and Grafana/Prometheus then fail to resolve each
# other (`lookup prometheus: no such host`). Docker re-registers the container
# hostname on that reconnect, so the hostname is what keeps the service name
# resolvable.
#
# Usage:
#   docker compose up --build
# then open:
#   http://localhost:5173             — web UI
#   http://localhost:8080/health      — twin health
#   http://localhost:8080/metrics     — raw Prometheus exposition
#   http://localhost:9090             — Prometheus UI
#   http://localhost:3000             — Grafana (admin / admin)
#
# Override the twin config (default: CORONET CONUS):
#   docker compose run --rm twin twinlight \
#       --config /app/examples/twin_config.yaml --rest-host 0.0.0.0

services:

  # GNPy runs here, not in the twin: at startup the twin opens a gnpy-api
  # session on its topology, and sends that session every path computation,
  # propagation, parameter change and redesign. Compose starts it whenever
  # the twin starts, and the twin waits until it is healthy.
  #
  # The build context is the git branch itself, so BuildKit clones it on the
  # first `up`; `docker compose build --no-cache gnpy-api` picks up new commits.
  # Point GNPY_API_GIT at another repository#ref, or a local checkout, to
  # build something else.
  gnpy-api:
    build:
      context: ${GNPY_API_GIT:-https://github.com/carlosnatalino/oopt-gnpy-api.git#feat/twinlight-network-api}
      args:
        # The package derives its version from git metadata (pbr), which
        # BuildKit drops from a git build context unless asked to keep it.
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"
    image: gnpy-api:twinlight
    # gnpy's oopt-gnpy-libyang has no manylinux aarch64 wheel; the
    # image is built for linux/amd64 and runs under Rosetta/qemu on
    # Apple Silicon hosts. Declared here too so compose doesn't warn
    # about the mismatch on every up.
    platform: linux/amd64
    container_name: twinlight-gnpy-api
    # Reached by the twin as http://gnpy-api:8080; not published on the host.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/v1.0/status').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    # If it restarts, its sessions are gone: the twin opens a new one and
    # replays the parameter changes it had applied.
    restart: unless-stopped

  twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: twinlight:latest
    container_name: twinlight
    hostname: twin
    ports:
      - "8080:8080"   # REST (TAPI + /config + /metrics + /admin)
      - "50051:50051" # gNMI gRPC
    volumes:
      # Snapshots and the shutdown checkpoint land here on the host so they
      # survive container rebuilds. Created on first up if it doesn't exist.
      - ./snapshots:/app/snapshots
    # No restore flag needed: the twin checkpoints itself on SIGTERM (which is
    # what `docker compose down`/`stop` sends) and resumes from that checkpoint
    # on the next start, or begins clean when there is none. Add --reset to
    # start from scratch, keeping the old checkpoint as checkpoint.json.bak.
    # --snapshot-dir is explicit because a snapshot_dir set inside a YAML file
    # resolves relative to that file's directory (/app/examples), which would
    # miss the volume mounted above. See the same note in the Dockerfile.
    command:
      - twinlight
      - --config
      - /app/examples/coronet_conus_config.yaml
      - --rest-host
      - "0.0.0.0"
      - --snapshot-dir
      - /app/snapshots
      - --gnpy-api-url
      - http://gnpy-api:8080
    depends_on:
      gnpy-api:
        condition: service_healthy
    # Give the twin time to write its checkpoint before SIGKILL. Docker's
    # default is 10s, which is tight for a large topology.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ui:
    build:
      context: ./twinlight-ui
      dockerfile: Dockerfile
    image: twinlight-ui:latest
    container_name: twinlight-ui
    hostname: ui
    environment:
      # URL the *browser* uses to reach the twin's REST API. The UI runs in
      # the visitor's browser, not on this docker network, so this must be a
      # host-reachable address — the twin's published port, NOT the "twin"
      # compose service name. Override for a remotely-hosted twin.
      # localhost:5173 is already in the twin's cors_origins, so CORS works
      # out of the box with the default config.
      TWIN_URL: "http://localhost:8080"
    ports:
      - "5173:80"   # served by nginx; matches the twin's allowed CORS origin
    depends_on:
      - twin
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: twinlight-prometheus
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 7-day local retention is plenty for the experimental workloads
      # this stack targets; bump if you keep the stack up for longer
      # campaigns.
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      twin:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    container_name: twinlight-grafana
    hostname: grafana
    environment:
      # Override on the command line for any real deployment.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Hide the welcome wizard so the user lands directly on the
      # provisioned dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON is served via the file provider; mount the
      # example dashboard read-only.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # One-shot: star the provisioned dashboard so it shows up under
  # "Starred" / the favourites list for the admin user.
  #
  # Grafana's file provisioning cannot express a star — stars are per-user
  # state in Grafana's own database, not part of a dashboard definition — so
  # the only way to set one is the HTTP API after the server is up. The call
  # is idempotent (starring twice returns 200), which matters because this
  # runs on every `docker compose up` while grafana-data persists the star.
  grafana-init:
    image: curlimages/curl:8.11.1
    container_name: twinlight-grafana-init
    hostname: grafana-init
    depends_on:
      - grafana
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      # Must match the "uid" field in docker/grafana/dashboards/*.json.
      DASHBOARD_UID: twinlight-overview
    entrypoint:
      - sh
      - -c
      - >-
        echo "waiting for grafana...";
        until curl -sf "$$GRAFANA_URL/api/health" >/dev/null 2>&1; do sleep 2; done;
        echo "waiting for dashboard provisioning...";
        while true; do
          code=$$(curl -s -o /dev/null -w "%{http_code}" -u "$$GRAFANA_USER:$$GRAFANA_PASSWORD" "$$GRAFANA_URL/api/dashboards/uid/$$DASHBOARD_UID" || true);
          case "$$code" in
            200) break ;;
            401|403)
              echo "grafana rejected $$GRAFANA_USER (HTTP $$code); skipping star";
              exit 0 ;;
          esac;
          sleep 2;
        done;
        curl -sf -X POST -u "$$GRAFANA_USER:$$GRAFANA_PASSWORD"
        "$$GRAFANA_URL/api/user/stars/dashboard/uid/$$DASHBOARD_UID" >/dev/null
        && echo "starred dashboard $$DASHBOARD_UID"
        || echo "could not star dashboard $$DASHBOARD_UID (non-fatal)"
    # A one-shot task: it must not be restarted after it exits.
    restart: "no"


volumes:
  prometheus-data:
  grafana-data:
