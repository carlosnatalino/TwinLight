# Example Prometheus scrape configuration for the TwinLight.
#
# Drop the `scrape_configs[0]` block into your prometheus.yml. The
# scrape interval is deliberately conservative — the twin's transient
# models move on minutes-to-tens-of-seconds timescales, so sub-second
# polling adds load without revealing new physics.
#
# Pair this with examples/grafana-dashboard.json (imported into
# Grafana) for the live-OPM + /config dashboard.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: twinlight
    metrics_path: /metrics
    scrape_interval: 15s
    # A twin with TWINLIGHT_API_TOKENS set answers /metrics with 401. Give
    # Prometheus one of its tokens: put the bare token in a file, point
    # credentials_file at it, and uncomment these three lines.
    # authorization:
    #   type: Bearer
    #   credentials_file: /path/to/twinlight.token
    static_configs:
      - targets:
          - "localhost:8080"
        labels:
          deployment: dev
