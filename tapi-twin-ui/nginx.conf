# nginx site config for the T-API Twin Web UI (single-page app).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Runtime config and the HTML shell must never be cached: config.js is
    # regenerated per container start from $TWIN_URL, and index.html points at
    # content-hashed bundles that change on every rebuild.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Hashed JS/CSS/asset bundles are immutable — cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
