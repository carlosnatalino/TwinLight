name: CI

# Test the implementation on every pull request (and on pushes to main).
on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, type-check & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        if: ${{ !cancelled() }}
        run: ruff check .

      # Run even if ruff failed, so both checks report in one run.
      - name: Mypy (type-check)
        if: ${{ !cancelled() }}
        run: mypy

      - name: Run tests with coverage
        if: ${{ !cancelled() }}
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tapi-twin-ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tapi-twin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      # Run even if the tests failed, so a build break is reported too.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
