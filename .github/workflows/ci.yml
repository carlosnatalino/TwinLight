name: CI

# Test the implementation on every pull request (and on pushes to main).
on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Lint, type-check & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # uv is the supported way to manage the environment (see CONTRIBUTING.md);
      # it resolves and installs the whole dependency tree in seconds.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package and dev dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Ruff (lint)
        if: ${{ !cancelled() }}
        run: uv run ruff check .

      # Run even if ruff failed, so both checks report in one run.
      - name: Mypy (type-check)
        if: ${{ !cancelled() }}
        run: uv run mypy

      - name: Run tests with coverage
        if: ${{ !cancelled() }}
        run: |
          uv run pytest --cov --cov-report=term-missing \
            --md-report --md-report-color=never | tee pytest-output.txt

      # Render the test-results and coverage tables on the run's "Summary" page.
      - name: Test & coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Test results"
            echo
            grep '^|' pytest-output.txt || echo "_No test report._"
            echo
            echo "## Test coverage"
            echo
            uv run coverage report --format=markdown --fail-under=0 \
              || echo "_No coverage data._"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twinlight-ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: twinlight-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      # Run even if the tests failed, so a build break is reported too.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `docker compose up --build` is the documented first-run path, so a
      # broken image is a broken quickstart. Building here also exercises the
      # twinlight-fetch-examples step that provisions the GNPy reference
      # topologies into the image (they are not committed to this repo).
      - name: Build twin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: twinlight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web UI image
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v7
        with:
          context: ./twinlight-ui
          file: ./twinlight-ui/Dockerfile
          push: false
          load: true
          tags: twinlight-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the example scenario must actually boot inside the image
      # and answer /health, which proves the provisioned GNPy data is usable.
      - name: Smoke-test the twin image
        run: |
          docker run -d --name twinlight-ci -p 8080:8080 twinlight:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "twin is healthy after ${i}s"
              curl -fsS http://localhost:8080/health
              docker rm -f twinlight-ci >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::twin did not become healthy within 60s"
          docker logs twinlight-ci
          docker rm -f twinlight-ci >/dev/null
          exit 1
