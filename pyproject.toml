[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapi-twin"
version = "0.1.0"
description = "T-API Network Digital Twin — optical network emulator with GNPy and T-API interfaces"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "networkx>=3.4",
    "grpcio>=1.67",
    "grpcio-tools>=1.67",
    "protobuf>=5.28",
    "gnpy>=2.14",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
tapi-twin = "tapi_twin.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
