[build-system]
# >=77 for PEP 639 `license` / `license-files` support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twinlight"
version = "0.1.0"
description = "TwinLight — a multi-timescale optical network digital twin with T-API interfaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Carlos Natalino", email = "carlos.natalino@chalmers.se" },
]
keywords = [
    "optical-networks",
    "digital-twin",
    "transport-api",
    "tapi",
    "gnpy",
    "qot-estimation",
    "network-emulator",
    "gnmi",
    "sdn",
]
classifiers = [
    # NB: no "License ::" classifier — PEP 639 supersedes it with the
    # `license`/`license-files` fields above, and setuptools rejects both.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "networkx>=3.4",
    "grpcio>=1.67",
    "grpcio-tools>=1.67",
    "protobuf>=5.28",
    "gnpy>=2.14",
    "matplotlib>=3.7",
    "prometheus-client>=0.21"
]

[project.optional-dependencies]
# Deliberately unpinned at the top: a new ruff or mypy release should
# surface new findings here as early as possible, rather than being
# frozen out. The floors are kept current so a local install resolves the
# same generation of tooling CI does — a stale local ruff silently passing
# what CI rejects is the failure mode this avoids.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-md-report>=0.6",
    "ruff>=0.16",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://github.com/carlosnatalino/TwinLight"
Repository = "https://github.com/carlosnatalino/TwinLight"
Issues = "https://github.com/carlosnatalino/TwinLight/issues"

[tool.uv]
# Supply-chain cooldown. `exclude-newer` takes a *duration*, which uv recomputes
# relative to "now" on every resolve, so this is a rolling 30-day window: any
# release younger than 30 days is invisible to the resolver, giving a
# compromised or broken upload time to be caught and yanked before we adopt it.
# Applies to every package, direct and transitive. It caps the *newest* side by
# date; the `>=` floors above cap the *oldest* side by version — the two are
# complementary. Override for a one-off with the `--exclude-newer` flag or the
# `UV_EXCLUDE_NEWER` environment variable (e.g. to pull a same-day security fix).
exclude-newer = "30 days"

[project.scripts]
twinlight = "twinlight.main:main"
twinlight-client = "twinlight_client.cli:main"
twinlight-fetch-examples = "twinlight.example_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated protobuf/gRPC code — not linted (regenerated from .proto files).
extend-exclude = ["src/twinlight/streaming/proto"]

# No explicit `select`: ruff's own defaults are used deliberately, so that a
# new release surfacing new rules shows up here as a CI failure to act on,
# rather than being silently frozen out by a pinned rule set.

[tool.ruff.lint.flake8-bugbear]
# FastAPI expresses request bodies and dependencies as call expressions in
# argument defaults (`body: dict | None = Body(default=None)`). That is the
# framework's documented idiom, not the mutable-default bug B008 targets,
# so these callables are declared immutable rather than blanket-ignoring
# the rule — a genuine B008 elsewhere still fails the build.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
# Generated protobuf/gRPC code is not type-checked.
exclude = ["src/twinlight/streaming/proto/"]

# Generated protobuf/gRPC modules: treated as opaque (Any) by the type checker.
[[tool.mypy.overrides]]
module = "twinlight.streaming.proto.*"
follow_imports = "skip"
ignore_errors = true

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "google.protobuf.*",
    "networkx.*",
    "yaml",
    "gnpy.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
# Generated protobuf/gRPC code is not hand-written — exclude it from coverage.
omit = ["src/twinlight/streaming/proto/*"]

[tool.coverage.report]
show_missing = true
precision = 1
# Regression floor — current coverage is ~70%; raise as coverage improves.
fail_under = 60
