[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapi-twin"
version = "0.1.0"
description = "T-API Network Digital Twin — optical network emulator with GNPy and T-API interfaces"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "networkx>=3.4",
    "grpcio>=1.67",
    "grpcio-tools>=1.67",
    "protobuf>=5.28",
    "gnpy>=2.14",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-md-report>=0.6",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
tapi-twin = "tapi_twin.main:main"
tapi-client = "tapi_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated protobuf/gRPC code — not linted (regenerated from .proto files).
extend-exclude = ["src/tapi_twin/streaming/proto"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
# Generated protobuf/gRPC code is not type-checked.
exclude = ["src/tapi_twin/streaming/proto/"]

# Generated protobuf/gRPC modules: treated as opaque (Any) by the type checker.
[[tool.mypy.overrides]]
module = "tapi_twin.streaming.proto.*"
follow_imports = "skip"
ignore_errors = true

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "google.protobuf.*",
    "networkx.*",
    "yaml",
    "gnpy.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
# Generated protobuf/gRPC code is not hand-written — exclude it from coverage.
omit = ["src/tapi_twin/streaming/proto/*"]

[tool.coverage.report]
show_missing = true
precision = 1
# Regression floor — current coverage is ~70%; raise as coverage improves.
fail_under = 60
