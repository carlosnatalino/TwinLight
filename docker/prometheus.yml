# Prometheus config for the docker-compose stack. The twin advertises
# its scrape endpoint at twin:8080/metrics on the shared bridge network.
#
# Scrape interval matches the slowest transient-model timescale
# (minutes) closely enough that sub-second polling would add load
# without revealing new physics. Bump or lower freely if you tune the
# transient periods in your twin YAML.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: twinlight
    metrics_path: /metrics
    scrape_interval: 15s
    # A twin with TWINLIGHT_API_TOKENS set answers /metrics with 401. Give
    # Prometheus one of its tokens: write the bare token to
    # docker/prometheus.token (git-ignored), uncomment its volume line in
    # docker-compose.yml, and uncomment these three lines.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/twinlight.token
    static_configs:
      - targets:
          - "twin:8080"
        labels:
          deployment: compose
